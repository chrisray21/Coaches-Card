<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Ball Lineup Generator</title>
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --panel:#f7f8fa; --line:#e2e5ea; --ink:#16181d; --mute:#6b7280;
  --green:#0f8a4c; --green-bg:#e7f6ed; --blue:#1d6fd0; --blue-bg:#e8f1fc;
  --amber:#a86a00; --amber-bg:#fdf1dc; --red:#c22e2e; --red-bg:#fdeaea;
  --navy:#12325c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}
h2{font-size:15px;margin:0 0 10px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy)}
h3{font-size:13px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mute);font-size:12.5px;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;border:none;background:none;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
button.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.btn:hover{background:#f0f2f5}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{background:#1b477e}
button.sm{padding:4px 9px;font-size:12px;font-weight:600}
button.danger{color:var(--red);border-color:#f0c9c9}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;font-size:13px}
th{background:#eef1f5;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--navy)}
select,input[type=text],input[type=date]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pos-btn{width:38px;padding:3px 0;text-align:center;border-radius:5px;border:1px solid var(--line);background:#fff;color:#aab0b8;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit}
.pos-btn.pri{background:var(--green-bg);border-color:#b6e0c7;color:var(--green)}
.pos-btn.sec{background:var(--blue-bg);border-color:#bcd8f6;color:var(--blue)}
.pos-btn.lock{background:var(--red-bg);border-color:#f2c2c2;color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--green-bg);border-color:#9ed3b6;color:var(--green);font-weight:600}
.chip.out{background:var(--red-bg);border-color:#f2c2c2;color:var(--red);text-decoration:line-through}
.grid td select{width:100%;border:none;background:transparent;font-weight:600;padding:3px 2px;font-size:13px}
.grid td{padding:1px 2px}
.grid td.pri{background:var(--green-bg)}
.grid td.sec{background:var(--blue-bg)}
.grid td.oth{background:var(--amber-bg)}
.grid td.bad{background:var(--red-bg)}
.grid th.poscol,.grid td.poscol{background:#eef1f5;font-weight:700;width:56px;text-align:center;color:var(--navy)}
.grid tr.pitch td{background:#fff7d6}
.bench td{font-size:12px;color:var(--mute);background:#fafbfc;vertical-align:top}
.legend{font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.12)}
.warn{background:var(--amber-bg);border:1px solid #ecd3a0;color:#7a4d00;padding:9px 12px;border-radius:8px;font-size:13px;margin-top:10px}
.good{background:var(--green-bg);border:1px solid #b6e0c7;color:#0b6b3b;padding:9px 12px;border-radius:8px;font-size:13px;margin-top:10px}
.bat li{padding:5px 8px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;display:flex;align-items:center;gap:8px;cursor:grab}
.bat li.drag{opacity:.4}
.bat ol{list-style:none;padding:0;margin:0;counter-reset:b}
.bat li::before{counter-increment:b;content:counter(b);width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}
.bat li .nm{flex:1;font-weight:600}
.saveflash{position:fixed;right:14px;bottom:14px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:20px;font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.saveflash.on{opacity:.92}
.muted{color:var(--mute);font-size:12.5px}
.help p,.help li{font-size:13.5px}
.help code{background:#eceff3;padding:1px 5px;border-radius:4px;font-size:12.5px}
.num{text-align:center;font-variant-numeric:tabular-nums}
.hot{background:var(--red-bg);color:var(--red);font-weight:700}
.cool{background:var(--green-bg);color:var(--green)}
@media print{
  body{background:#fff}
  .tabs,.noprint,.help{display:none!important}
  .card{border:none;background:none;padding:0;margin:0 0 10px;break-inside:avoid}
  .wrap{padding:0;max-width:none}
  th,td{padding:3px 5px;font-size:11px}
  #printhead{display:block!important}
}
#printhead{display:none;font-weight:700;font-size:16px;margin-bottom:6px}
.modalwrap{position:fixed;inset:0;background:rgba(18,50,92,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-size:16px;color:var(--navy);text-transform:none;letter-spacing:0}
.modal p{margin:0 0 14px;font-size:13.5px;color:#3d434c}
.modal .opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;cursor:pointer}
.modal .opt:hover{background:#f0f4f9;border-color:#b9cbe2}
.modal .opt b{display:block;font-size:13.5px;color:var(--navy)}
.modal .opt span{font-size:12.5px;color:var(--mute)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.modal select{width:100%;padding:8px;font-size:14px;margin-bottom:14px}
.stashnote{font-size:12px;color:var(--blue);margin-top:6px}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:10px;background:var(--amber-bg);color:var(--amber);letter-spacing:.02em}
.slotwas{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.bat li .nm{flex:1;font-weight:600;display:flex;align-items:center;gap:7px}
</style>
</head>
<body>
<div class="wrap">
  <div id="printhead"></div>
  <div class="noprint">
    <h1>Fall Ball Lineup Generator</h1>
    <div class="sub">Rotate pitchers by inning &middot; develop primary positions &middot; keep bench innings fair &middot; any game length</div>
    <div class="tabs">
      <button class="tab on" data-tab="lineup">Lineup</button>
      <button class="tab" data-tab="batting">Batting Order</button>
      <button class="tab" data-tab="roster">Roster</button>
      <button class="tab" data-tab="season">Season</button>
      <button class="tab" data-tab="help">How to Save</button>
    </div>
  </div>

  <div id="tab-lineup"></div>
  <div id="tab-batting" style="display:none"></div>
  <div id="tab-roster" style="display:none"></div>
  <div id="tab-season" style="display:none"></div>
  <div id="tab-help" style="display:none"></div>
</div>
<div class="saveflash" id="flash">Saved</div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<script>
/* ================= ENGINE ================= */
var FIELD_POS=['C','1B','2B','3B','SS','LF','CF','RF'];
var ALL_POS=['P'].concat(FIELD_POS);

function posWeight(pl,pos,isPriority,repeats){
  if(pl.lockout.indexOf(pos)!==-1) return null;
  var isP=pl.primary.indexOf(pos)!==-1, isS=pl.secondary.indexOf(pos)!==-1, w;
  if(isPriority) w = isP?140:(isS?-30:-90);
  else w = isP?30:(isS?10:-25);
  return w - 7*(repeats||0);
}
function assignPositions(players,priority,posCount){
  var n=players.length,m=FIELD_POS.length;
  if(n>m) return null;
  var W=[],i,j;
  for(i=0;i<n;i++){W[i]=[];for(j=0;j<m;j++){
    var pl=players[i], reps=(posCount[pl.id]&&posCount[pl.id][FIELD_POS[j]])||0;
    W[i][j]=posWeight(pl,FIELD_POS[j],priority.indexOf(pl.id)!==-1,reps);
  }}
  var full=(1<<n)-1, VAC=-600, dp=[],par=[];
  for(j=0;j<=m;j++){dp[j]=new Float64Array(full+1).fill(-Infinity);par[j]=new Int16Array(full+1).fill(-2);}
  dp[0][0]=0;
  for(j=0;j<m;j++){
    for(var mask=0;mask<=full;mask++){
      var cur=dp[j][mask]; if(cur===-Infinity) continue;
      if(cur+VAC>dp[j+1][mask]){dp[j+1][mask]=cur+VAC;par[j+1][mask]=-1;}
      for(i=0;i<n;i++){
        if(mask&(1<<i)) continue;
        var w=W[i][j]; if(w===null) continue;
        var nm=mask|(1<<i);
        if(cur+w>dp[j+1][nm]){dp[j+1][nm]=cur+w;par[j+1][nm]=i;}
      }
    }
  }
  if(dp[m][full]===-Infinity) return null;
  var out={},mk=full;
  for(j=m;j>0;j--){
    var p=par[j][mk];
    if(p>=0){out[FIELD_POS[j-1]]=players[p].id;mk=mk&~(1<<p);} else out[FIELD_POS[j-1]]=null;
  }
  return {map:out,score:dp[m][full]};
}
function generateGame(opts){
  var roster=opts.roster,byId={};roster.forEach(function(p){byId[p.id]=p;});
  var present=opts.present.filter(function(id){return byId[id];});
  var INN=opts.innings||5, priority=opts.priority||[], seasonSits=opts.seasonSits||{};
  var restarts=opts.restarts||180, benchCount=Math.max(0,present.length-9), best=null;
  for(var attempt=0;attempt<restarts;attempt++){
    var gameSits={};present.forEach(function(id){gameSits[id]=0;});
    var lastSat={},posCount={};present.forEach(function(id){posCount[id]={};});
    var innings=[],ok=true,weightSum=0,restBonus=0,consec=0;
    for(var i=0;i<INN&&ok;i++){
      var pit=opts.pitchers[i]||null;
      if(pit&&present.indexOf(pit)===-1) pit=null;
      var pool=present.filter(function(id){return id!==pit;});
      var nextPit=(i+1<INN)?opts.pitchers[i+1]:null;
      var ii=i;
      var scored=pool.map(function(id){
        var s=-100*gameSits[id]-12*(seasonSits[id]||0);
        if(priority.indexOf(id)!==-1) s-=6;
        if(lastSat[id]===ii-1) s-=45;
        if(opts.restPitcher!==false&&nextPit&&id===nextPit) s+=30;
        return {id:id,s:s+Math.random()*26};
      }).sort(function(a,b){return b.s-a.s;});
      var result=null,bench=null;
      for(var tries=0;tries<25&&!result;tries++){
        var order=scored;
        if(tries>0) order=scored.map(function(x){return {id:x.id,s:x.s+Math.random()*60};}).sort(function(a,b){return b.s-a.s;});
        bench=order.slice(0,benchCount).map(function(x){return x.id;});
        var fielders=pool.filter(function(id){return bench.indexOf(id)===-1;}).map(function(id){return byId[id];});
        result=assignPositions(fielders,priority,posCount);
      }
      if(!result){ok=false;break;}
      var map={};ALL_POS.forEach(function(p){map[p]=null;});
      map.P=pit;FIELD_POS.forEach(function(p){map[p]=result.map[p];});
      weightSum+=result.score;
      bench.forEach(function(id){gameSits[id]++;if(lastSat[id]===ii-1)consec++;lastSat[id]=ii;});
      if(opts.restPitcher!==false&&nextPit&&bench.indexOf(nextPit)!==-1) restBonus++;
      ALL_POS.forEach(function(p){var id=map[p];if(!id)return;posCount[id][p]=(posCount[id][p]||0)+1;});
      innings.push({map:map,bench:bench.slice()});
    }
    if(!ok) continue;
    var sitVals=present.map(function(id){return gameSits[id];});
    var spread=Math.max.apply(null,sitVals)-Math.min.apply(null,sitVals);
    var cum=present.map(function(id){return gameSits[id]+(seasonSits[id]||0);});
    var cumSpread=Math.max.apply(null,cum)-Math.min.apply(null,cum);
    var total=weightSum-8000*Math.max(0,spread-1)-60*consec-15*cumSpread+25*restBonus;
    if(!best||total>best.total) best={total:total,innings:innings};
  }
  return best;
}

/* Tally bench innings, last bench inning, and position counts from innings already played. */
function historyFrom(existing,present){
  var gameSits={},posCount={},lastSat={};
  present.forEach(function(id){gameSits[id]=0;posCount[id]={};});
  (existing||[]).forEach(function(inn,i){
    inn.bench.forEach(function(id){if(gameSits[id]!=null){gameSits[id]++;lastSat[id]=i;}});
    ALL_POS.forEach(function(pos){
      var id=inn.map[pos]; if(!id||!posCount[id]) return;
      posCount[id][pos]=(posCount[id][pos]||0)+1;
    });
  });
  return {gameSits:gameSits,posCount:posCount,lastSat:lastSat};
}

/* Build ONE new inning that sits on top of innings already played, leaving those untouched.
   opts: { roster, present, existing, pitcher, priority, seasonSits, restarts } */
function generateOneInning(opts){
  var byId={};opts.roster.forEach(function(p){byId[p.id]=p;});
  var present=opts.present.filter(function(id){return byId[id];});
  var priority=opts.priority||[], seasonSits=opts.seasonSits||{};
  var H=historyFrom(opts.existing,present);
  var idx=(opts.existing||[]).length;
  var pit=(opts.pitcher&&present.indexOf(opts.pitcher)!==-1)?opts.pitcher:null;
  var pool=present.filter(function(id){return id!==pit;});
  var benchCount=Math.max(0,present.length-9);
  var best=null;
  for(var attempt=0;attempt<(opts.restarts||300);attempt++){
    var scored=pool.map(function(id){
      var s=-100*H.gameSits[id]-12*(seasonSits[id]||0);
      if(priority.indexOf(id)!==-1) s-=6;
      if(H.lastSat[id]===idx-1) s-=45;
      return {id:id,s:s+Math.random()*26};
    }).sort(function(a,b){return b.s-a.s;});
    var bench=scored.slice(0,benchCount).map(function(x){return x.id;});
    var fielders=pool.filter(function(id){return bench.indexOf(id)===-1;}).map(function(id){return byId[id];});
    var res=assignPositions(fielders,priority,H.posCount);
    if(!res) continue;
    var sits={};present.forEach(function(id){sits[id]=H.gameSits[id];});
    bench.forEach(function(id){sits[id]++;});
    var v=present.map(function(id){return sits[id];});
    var spread=Math.max.apply(null,v)-Math.min.apply(null,v);
    var consec=bench.filter(function(id){return H.lastSat[id]===idx-1;}).length;
    var total=res.score-8000*Math.max(0,spread-1)-60*consec;
    if(!best||total>best.total){
      var map={};ALL_POS.forEach(function(p){map[p]=null;});
      map.P=pit;FIELD_POS.forEach(function(p){map[p]=res.map[p];});
      best={total:total,inning:{map:map,bench:bench.slice()},spread:spread};
    }
  }
  return best;
}

/* ================= STATE ================= */
var KEY='fallball_lineup_v1b';
try{localStorage.removeItem('fallball_lineup_v1');localStorage.removeItem('fb_boot_counter');}catch(e){}
var DEFAULT_ROSTER=[
 ['Aaron','2B,SS','LF,CF,RF','C'],
 ['Adam','3B,1B','LF,CF,RF','C'],
 ['Beau','C','1B,3B,LF,CF,RF','SS,2B'],
 ['Brady','1B,CF','LF,RF','C'],
 ['Colin','SS,2B','CF,LF,RF','C'],
 ['Gavin','LF,CF,RF','1B','C'],
 ['Hayden','1B,RF,LF,CF','3B,2B,SS','C'],
 ['Jacob','C,SS,2B','1B,3B,LF,CF,RF',''],
 ['Jaxxon','1B','RF,CF,LF','C'],
 ['Nico','2B,SS','RF,CF,LF,C',''],
 ['Sterling','LF,CF,RF','2B,3B,C',''],
 ['Theo','2B,3B,C','1B,LF,CF,RF','']
];
function uid(){return 'p'+Math.random().toString(36).slice(2,9);}
function freshState(){
  var roster=DEFAULT_ROSTER.map(function(r){
    return {id:uid(),name:r[0],
      primary:r[1]?r[1].split(','):[],
      secondary:(r[2]?r[2].split(','):[]).filter(function(x,i,a){return a.indexOf(x)===i;}),
      lockout:r[3]?r[3].split(','):[]};
  });
  var games=[];
  for(var i=0;i<6;i++) games.push(newGame('Game '+(i+1)));
  return {version:1,roster:roster,games:games,current:0};
}
var DEFAULT_INNINGS=5;
function newGame(name,innings){
  var n=innings||DEFAULT_INNINGS,pit=[];
  for(var i=0;i<n;i++) pit.push(null);
  return {id:'g'+Math.random().toString(36).slice(2,8),name:name,date:'',opponent:'',
    innings:n,absent:[],pitchers:pit,priority:[],lineup:null,batting:null,stash:[]};
}
function INNS(g){return (g&&g.innings)||DEFAULT_INNINGS;}
function clampInn(n){return Math.max(1,Math.min(12,n|0));}
/* resize the innings/pitcher fields without touching a generated lineup */
function resizeInnings(g,n){
  n=clampInn(n);
  g.innings=n;
  g.pitchers=g.pitchers||[];
  while(g.pitchers.length<n) g.pitchers.push(null);
  g.pitchers.length=n;
  return n;
}
/* full reset: new length, throw away the lineup so it can be regenerated */
function setInnings(g,n){
  n=resizeInnings(g,n);
  g.lineup=null; g.stash=[];
  return n;
}
/* GAME SHORTENED: keep innings 1..n exactly as played, park the rest so they can come back */
function trimInnings(g,n){
  n=clampInn(n);
  if(!g.lineup||n>=g.lineup.length) return;
  var removed=g.lineup.slice(n);
  g.stash=removed.concat(g.stash||[]);
  g.lineup=g.lineup.slice(0,n);
  resizeInnings(g,n);
}
/* a parked inning can only be restored if everyone in it is still available */
function stashUsable(g,inn){
  if(!inn) return false;
  var pres=presentIds(g), ok=true;
  ALL_POS.forEach(function(pos){
    var id=inn.map[pos];
    if(id&&pres.indexOf(id)===-1) ok=false;
  });
  inn.bench.forEach(function(id){if(pres.indexOf(id)===-1) ok=false;});
  var onField=0;ALL_POS.forEach(function(p){if(inn.map[p])onField++;});
  if(onField+inn.bench.length!==pres.length) ok=false;
  return ok;
}
/* GAME WENT LONGER: append one inning, leaving every played inning untouched.
   Returns 'restored' | 'generated' | 'need-pitcher' | 'failed' */
function appendInning(g,pitcherId,allowPrompt){
  if(!g.lineup) return 'failed';
  var idx=g.lineup.length;
  var st=(g.stash&&g.stash.length)?g.stash[0]:null;
  if(st&&stashUsable(g,st)){
    g.stash.shift();
    g.lineup.push(st);
    resizeInnings(g,g.lineup.length);
    g.pitchers[idx]=st.map.P||null;
    return 'restored';
  }
  g.stash=[];
  if(allowPrompt&&!pitcherId&&!g.pitchers[idx]) return 'need-pitcher';
  var pit=pitcherId||g.pitchers[idx]||null;
  var res=generateOneInning({roster:S.roster,present:presentIds(g),existing:g.lineup,
    pitcher:pit,priority:g.priority,seasonSits:seasonSitsBefore(S.current),restarts:300});
  if(!res) return 'failed';
  g.lineup.push(res.inning);
  resizeInnings(g,g.lineup.length);
  g.pitchers[idx]=pit;
  return 'generated';
}

/* ================= MODAL ================= */
function closeModal(){
  var m=document.getElementById('modalwrap');
  if(m&&m.parentNode) m.parentNode.removeChild(m);
}
/* opts: {title, body, options:[{label,note,fn}], cancel:bool} */
function showModal(opts){
  closeModal();
  var wrap=document.createElement('div');
  wrap.className='modalwrap'; wrap.id='modalwrap';
  var h='<div class="modal"><h3>'+opts.title+'</h3>';
  if(opts.body) h+='<p>'+opts.body+'</p>';
  if(opts.selectHtml) h+=opts.selectHtml;
  (opts.options||[]).forEach(function(o,i){
    h+='<button class="opt" data-opt="'+i+'"><b>'+o.label+'</b>'+(o.note?'<span>'+o.note+'</span>':'')+'</button>';
  });
  h+='<div class="foot"><button class="btn" data-opt="cancel">Cancel</button></div></div>';
  wrap.innerHTML=h;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',function(e){
    if(e.target===wrap){closeModal();if(opts.onCancel)opts.onCancel();return;}
    var b=e.target.closest('[data-opt]');
    if(!b) return;
    var k=b.dataset.opt;
    var sel=wrap.querySelector('select');
    var val=sel?sel.value:null;
    closeModal();
    if(k==='cancel'){ if(opts.onCancel) opts.onCancel(); return; }
    opts.options[+k].fn(val);
  });
}
var S=null;
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);}}catch(e){}
  window.__restored=!!raw;
  if(!S||!S.roster||!S.roster.length) S=freshState();
  S.roster.forEach(function(p){p.primary=p.primary||[];p.secondary=p.secondary||[];p.lockout=p.lockout||[];});
  if(!S.games||!S.games.length) S.games=[newGame('Game 1')];
  S.games.forEach(function(g){
    g.pitchers=g.pitchers||[];
    g.stash=g.stash||[];
    if(!g.innings) g.innings=(g.lineup&&g.lineup.length)||g.pitchers.length||DEFAULT_INNINGS;
    while(g.pitchers.length<g.innings) g.pitchers.push(null);
    g.pitchers.length=g.innings;
    if(g.lineup&&g.lineup.length!==g.innings) g.lineup=null;
  });
  if(S.current==null||S.current>=S.games.length) S.current=0;
}
var flashT;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));
    var f=document.getElementById('flash');f.classList.add('on');
    clearTimeout(flashT);flashT=setTimeout(function(){f.classList.remove('on');},1100);
  }catch(e){alert('Could not save: '+e.message);}
}
function P(id){for(var i=0;i<S.roster.length;i++) if(S.roster[i].id===id) return S.roster[i];return null;}
function nm(id){var p=P(id);return p?p.name:'--';}
function G(){return S.games[S.current];}
function presentIds(g){return S.roster.filter(function(p){return g.absent.indexOf(p.id)===-1;}).map(function(p){return p.id;});}
function fit(id,pos){
  var p=P(id); if(!p||pos==='P') return 'pri';
  if(p.lockout.indexOf(pos)!==-1) return 'bad';
  if(p.primary.indexOf(pos)!==-1) return 'pri';
  if(p.secondary.indexOf(pos)!==-1) return 'sec';
  return 'oth';
}
/* bench innings from every game BEFORE index gi that has a lineup */
function seasonSitsBefore(gi){
  var out={};S.roster.forEach(function(p){out[p.id]=0;});
  for(var i=0;i<gi;i++){
    var g=S.games[i]; if(!g.lineup) continue;
    g.lineup.forEach(function(inn){inn.bench.forEach(function(id){if(out[id]!=null)out[id]++;});});
  }
  return out;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---- batting order: each game flips the previous game's final order ---- */
function prevOrderIndex(gi){
  for(var i=gi-1;i>=0;i--){
    var b=S.games[i].batting;
    if(b&&b.length) return i;
  }
  return -1;
}
/* games before gi where this player was marked absent (used to break ties among returnees) */
function missedCount(id,gi){
  var n=0;
  for(var i=0;i<gi;i++){
    var g=S.games[i];
    if((g.batting&&g.batting.length)||g.lineup){ if(g.absent.indexOf(id)!==-1) n++; }
  }
  return n;
}
/* Reverse the last game's order, drop today's absentees, and lead off with anyone
   returning from an absence so they make up some of the at-bats they missed. */
function computeBattingOrder(gi){
  var g=S.games[gi], pres=presentIds(g);
  var pi=prevOrderIndex(gi);
  if(pi<0) return {order:pres.slice(),from:-1,returning:[]};
  var base=S.games[pi].batting.slice().reverse();
  var kept=base.filter(function(id){return pres.indexOf(id)!==-1;});
  var returning=pres.filter(function(id){return base.indexOf(id)===-1;});
  returning.sort(function(a,b){
    var d=missedCount(b,gi)-missedCount(a,gi);
    return d||nm(a).localeCompare(nm(b));
  });
  return {order:returning.concat(kept),from:pi,returning:returning};
}
/* keep a game's order valid: build it if missing, drop absentees, lead off returnees */
function syncBatting(g,gi){
  var pres=presentIds(g);
  if(!g.batting||!g.batting.length){ g.batting=computeBattingOrder(gi).order; return; }
  g.batting=g.batting.filter(function(id){return pres.indexOf(id)!==-1;});
  var missing=pres.filter(function(id){return g.batting.indexOf(id)===-1;});
  if(missing.length) g.batting=missing.concat(g.batting);
}

var TABS=['lineup','batting','roster','season','help'];
function show(t){
  TABS.forEach(function(x){document.getElementById('tab-'+x).style.display=(x===t?'':'none');});
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('on',b.dataset.tab===t);});
  render();
}
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.tab'):null;
  if(t) show(t.dataset.tab);
});

function checkPanel(g,pres){
  var sits={};pres.forEach(function(id){sits[id]=0;});
  g.lineup.forEach(function(inn){inn.bench.forEach(function(id){if(sits[id]!=null)sits[id]++;});});
  var vals=pres.map(function(id){return sits[id];});
  var spread=vals.length?Math.max.apply(null,vals)-Math.min.apply(null,vals):0;
  var issues=[],notes=[];
  if(spread>1) issues.push('Bench innings differ by '+spread+'. If the game was cut short mid-rotation this is just what happened — the season tracker will even it out next game. Otherwise regenerate.');
  var dup=0,openc=0,lock=0,other=[];
  g.lineup.forEach(function(inn,i){
    var seen={};
    ALL_POS.forEach(function(pos){
      var id=inn.map[pos];
      if(!id){openc++;return;}
      if(seen[id]) dup++; seen[id]=1;
      if(pos!=='P'){
        var f=fit(id,pos);
        if(f==='bad') lock++;
        if(f==='oth') other.push(nm(id)+' at '+pos+' (inn '+(i+1)+')');
      }
    });
  });
  if(dup) issues.push(dup+' player(s) assigned to two spots in the same inning.');
  if(lock) issues.push(lock+' lock-out position assignment(s) — shown in red.');
  if(openc) notes.push(openc+' open spot(s) on the field.');
  if(other.length) notes.push('Off-list assignments: '+other.join(', '));
  var rest=0,restp=0;
  for(var i=0;i<INNS(g)-1;i++){
    var np=g.pitchers[i+1];
    if(np&&np!==g.pitchers[i]){restp++;if(g.lineup[i].bench.indexOf(np)!==-1)rest++;}
  }
  if(restp) notes.push('Warm-up rest before pitching: '+rest+' of '+restp+' pitchers sat the prior inning.');
  var out='';
  if(issues.length) out+='<div class="warn"><b>Check this:</b><br>'+issues.join('<br>')+'</div>';
  else out+='<div class="good">Bench innings are even (max difference '+spread+'), no conflicts, no lock-out violations.</div>';
  if(notes.length) out+='<div class="muted" style="margin-top:8px">'+notes.join(' &middot; ')+'</div>';
  return out;
}

function devTable(g,pres){
  var sits={},plays={};
  pres.forEach(function(id){sits[id]=0;plays[id]={};});
  g.lineup.forEach(function(inn){
    inn.bench.forEach(function(id){if(sits[id]!=null)sits[id]++;});
    ALL_POS.forEach(function(pos){var id=inn.map[pos];if(id&&plays[id])plays[id][pos]=(plays[id][pos]||0)+1;});
  });
  var h='<div class="card"><h2>This Game &mdash; Player Detail</h2><table><tr><th>Player</th><th class="num">Bench</th><th class="num">Played</th><th class="num">Primary Inn</th><th>Positions</th></tr>';
  pres.slice().sort(function(a,b){return nm(a).localeCompare(nm(b));}).forEach(function(id){
    var p=P(id),pri=0,list=[];
    Object.keys(plays[id]).forEach(function(pos){
      var c=plays[id][pos];
      if(pos!=='P'&&p.primary.indexOf(pos)!==-1) pri+=c;
      list.push(pos+(c>1?' x'+c:''));
    });
    h+='<tr><td>'+esc(p.name)+(g.priority.indexOf(id)!==-1?' ★':'')+'</td><td class="num">'+sits[id]+'</td><td class="num">'+(INNS(g)-sits[id])+'</td><td class="num">'+pri+'</td><td>'+list.join(', ')+'</td></tr>';
  });
  h+='</table></div>';
  return h;
}

function wireLineup(){
  var g=G();
  var q=function(s){return document.querySelector(s);};
  q('#gsel').onchange=function(){S.current=+this.value;save();render();};
  q('#gdate').onchange=function(){g.date=this.value;save();};
  q('#gopp').oninput=function(){g.opponent=this.value;save();};
  q('#ginn').onchange=function(){
    var n=+this.value, cur=INNS(g);
    if(n===cur) return;
    if(!g.lineup){ setInnings(g,n); save(); renderLineup(); return; }
    var longer=n>cur;
    showModal({
      title:'Change '+esc(g.name)+' from '+cur+' to '+n+' innings',
      body:longer
        ? 'The game went longer than planned, or you want a completely different lineup?'
        : 'The game ended early, or you want a completely different lineup?',
      options:[
        {label:longer?'Add inning'+(n-cur>1?'s':'')+' to this lineup':'Cut the extra inning'+(cur-n>1?'s':'')+' off the end',
         note:longer
           ? 'Innings 1–'+cur+' stay exactly as played. Only inning'+(n-cur>1?'s ':' ')+(cur+1)+(n-cur>1?'–'+n:'')+' get built, using who has already sat.'
           : 'Innings 1–'+n+' stay exactly as played. The rest are parked and come back if you add innings again.',
         fn:function(){ adjustLength(n); }},
        {label:'Start over — generate a brand-new '+n+'-inning lineup',
         note:'Throws away the current lineup and rebuilds all '+n+' innings from scratch.',
         fn:function(){ setInnings(g,n); save(); doGenerate(); }}
      ],
      onCancel:function(){ renderLineup(); }
    });
  };
  if(g.lineup){
    var add=document.getElementById('addinn'), drop=document.getElementById('dropinn');
    if(add) add.onclick=function(){ adjustLength(INNS(g)+1); };
    if(drop) drop.onclick=function(){ if(INNS(g)>1) adjustLength(INNS(g)-1); };
  }
  q('#addgame').onclick=function(){S.games.push(newGame('Game '+(S.games.length+1),INNS(g)));S.current=S.games.length-1;save();render();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-abs]'),function(c){
    c.onclick=function(){
      var id=c.dataset.abs,i=g.absent.indexOf(id);
      if(i===-1){g.absent.push(id);
        var pi=g.priority.indexOf(id); if(pi!==-1) g.priority.splice(pi,1);
        for(var k=0;k<g.pitchers.length;k++) if(g.pitchers[k]===id) g.pitchers[k]=null;
      } else g.absent.splice(i,1);
      save();renderLineup();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pri]'),function(c){
    c.onclick=function(){
      var id=c.dataset.pri,i=g.priority.indexOf(id);
      if(i===-1) g.priority.push(id); else g.priority.splice(i,1);
      save();renderLineup();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pit]'),function(s){
    s.onchange=function(){
      var i=+s.dataset.pit, val=s.value||null;
      g.pitchers[i]=val;
      /* keep an already-generated grid in step with the pitcher list */
      if(g.lineup&&i<g.lineup.length) swapInto(i,'P',val);
      save();renderLineup();
    };
  });
  q('#gen').onclick=q('#regen').onclick=function(){doGenerate();};
  q('#clear').onclick=function(){g.lineup=null;save();renderLineup();};
  q('#printbtn').onclick=function(){
    document.getElementById('printhead').textContent=g.name+(g.opponent?' vs '+g.opponent:'')+(g.date?'  '+g.date:'');
    window.print();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-cell]'),function(s){
    s.onchange=function(){
      var parts=s.dataset.cell.split('|'),inn=+parts[0],pos=parts[1],val=s.value||null;
      swapInto(inn,pos,val);save();renderLineup();
    };
  });
}

/* manual override: move player into (inn,pos), swapping whoever is displaced */
function swapInto(inn,pos,val){
  var g=G(),L=g.lineup[inn],prev=L.map[pos];
  if(val===prev) return;
  if(!val){ L.map[pos]=null; if(prev&&L.bench.indexOf(prev)===-1) L.bench.push(prev); return; }
  var from=null;
  ALL_POS.forEach(function(p){if(L.map[p]===val) from=p;});
  var bi=L.bench.indexOf(val);
  L.map[pos]=val;
  if(from){ L.map[from]=prev||null; if(!prev){ /* leave open */ } }
  else if(bi!==-1){ L.bench.splice(bi,1); if(prev) L.bench.push(prev); }
  else if(prev&&L.bench.indexOf(prev)===-1) L.bench.push(prev);
}

/* Change a game's length while keeping every inning that was actually played.
   Shorter -> trim and park. Longer -> restore parked innings, else build new ones. */
function adjustLength(n){
  var g=G();
  n=clampInn(n);
  if(!g.lineup){ setInnings(g,n); save(); renderLineup(); return; }
  if(n<=g.lineup.length){ trimInnings(g,n); save(); renderLineup(); return; }
  addNext();
  function addNext(){
    var g=G();
    if(g.lineup.length>=n){ save(); renderLineup(); return; }
    var idx=g.lineup.length, pres=presentIds(g);
    var st=(g.stash&&g.stash.length)?g.stash[0]:null;
    if(st&&stashUsable(g,st)){ appendInning(g,null,false); addNext(); return; }
    if(pres.length<1){ alert('No players are marked available for this game.'); renderLineup(); return; }
    showModal({
      title:'Who pitches inning '+(idx+1)+'?',
      body:'Innings 1&ndash;'+idx+' stay exactly as played. This inning is built around who has already sat, so bench time stays even across the longer game.',
      selectHtml:'<select><option value="">&mdash; leave pitcher open &mdash;</option>'+
        pres.map(function(id){return '<option value="'+id+'"'+(g.pitchers[idx]===id?' selected':'')+'>'+esc(nm(id))+'</option>';}).join('')+'</select>',
      options:[{label:'Build inning '+(idx+1),note:'Fills the other eight spots automatically.',
        fn:function(val){
          var r=appendInning(g,val||null,false);
          if(r==='failed'){
            alert('Could not build inning '+(idx+1)+'. Too many lock-outs for the players available — check Position Coverage on the Roster tab.');
            save();renderLineup();return;
          }
          save();addNext();
        }}],
      onCancel:function(){ save(); renderLineup(); }
    });
  }
}

function doGenerate(){
  var g=G(),pres=presentIds(g);
  if(!g.pitchers.some(function(x){return x;})){
    if(!confirm('No pitchers selected yet. Generate anyway and leave P open?')) return;
  }
  var btn=document.getElementById('gen');if(btn){btn.textContent='Working...';btn.disabled=true;}
  setTimeout(function(){
    var res=generateGame({roster:S.roster,present:pres,pitchers:g.pitchers,priority:g.priority,
      innings:INNS(g),seasonSits:seasonSitsBefore(S.current),restarts:180});
    if(!res){
      alert('Could not build a legal lineup. Too many lock-outs for the players available — loosen a lock-out on the Roster tab or mark more players present.');
    } else {
      g.lineup=res.innings.map(function(x){return {map:x.map,bench:x.bench};});
      g.stash=[];
      syncBatting(g,S.current);
      save();
    }
    render();
  },20);
}

/* ================= BATTING TAB ================= */
function renderBatting(){
  var g=G(),pres=presentIds(g),el=document.getElementById('tab-batting');
  syncBatting(g,S.current);
  var pi=prevOrderIndex(S.current);
  var prevOrder=pi>=0?S.games[pi].batting:null;
  var h='<div class="card"><h2>Batting Order &mdash; '+esc(g.name)+'</h2>';
  if(pi>=0){
    h+='<div class="good noprint" style="margin-top:0">Flipped from <b>'+esc(S.games[pi].name)+'</b>: whoever batted last there bats first here, and so on down the card. Anyone returning from an absence leads off. Drag to change anything &mdash; the next game reverses whatever you end up with.</div>';
  } else {
    h+='<div class="muted noprint">This is the first game with an order, so set it however you like. Every game after this one automatically flips it.</div>';
  }
  h+='<div class="muted noprint" style="margin-top:8px">Continuous order: every available player bats, whether or not they are on the field.</div>';
  h+='<div class="row noprint" style="margin:10px 0">';
  if(pi>=0) h+='<button class="btn sm primary" id="batFlip">Re-flip from '+esc(S.games[pi].name)+'</button>';
  h+='<button class="btn sm" id="batAZ">Sort A–Z</button><button class="btn sm" id="batShuf">Shuffle</button><button class="btn sm" id="batRev">Reverse</button><button class="btn sm" id="batPrint">Print</button></div>';
  h+='<div class="bat"><ol id="batlist">';
  g.batting.forEach(function(id,i){
    var was=prevOrder?prevOrder.indexOf(id):-1;
    var tag=prevOrder?(was===-1
      ?'<span class="badge">BACK FROM ABSENCE</span>'
      :'<span class="slotwas">was #'+(was+1)+' in '+esc(S.games[pi].name.replace('Game ','G'))+'</span>'):'';
    h+='<li draggable="true" data-i="'+i+'"><span class="nm">'+esc(nm(id))+tag+'</span>'+
       '<span class="noprint"><button class="btn sm" data-up="'+i+'">↑</button> <button class="btn sm" data-dn="'+i+'">↓</button></span></li>';
  });
  h+='</ol></div>';
  if(g.absent.length) h+='<div class="muted" style="margin-top:8px">Not batting (absent): '+g.absent.map(function(id){return esc(nm(id));}).join(', ')+'</div>';
  h+='</div>';
  el.innerHTML=h;
  var q=function(s){return document.querySelector(s);};
  var flip=document.getElementById('batFlip');
  if(flip) flip.onclick=function(){g.batting=computeBattingOrder(S.current).order;save();renderBatting();};
  q('#batAZ').onclick=function(){g.batting.sort(function(a,b){return nm(a).localeCompare(nm(b));});save();renderBatting();};
  q('#batRev').onclick=function(){g.batting.reverse();save();renderBatting();};
  q('#batShuf').onclick=function(){g.batting.sort(function(){return Math.random()-.5;});save();renderBatting();};
  q('#batPrint').onclick=function(){window.print();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-up]'),function(b){
    b.onclick=function(){var i=+b.dataset.up;if(i>0){var t=g.batting[i];g.batting[i]=g.batting[i-1];g.batting[i-1]=t;save();renderBatting();}};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-dn]'),function(b){
    b.onclick=function(){var i=+b.dataset.dn;if(i<g.batting.length-1){var t=g.batting[i];g.batting[i]=g.batting[i+1];g.batting[i+1]=t;save();renderBatting();}};
  });
  var dragI=null;
  Array.prototype.forEach.call(document.querySelectorAll('#batlist li'),function(li){
    li.ondragstart=function(){dragI=+li.dataset.i;li.classList.add('drag');};
    li.ondragend=function(){li.classList.remove('drag');};
    li.ondragover=function(e){e.preventDefault();};
    li.ondrop=function(e){
      e.preventDefault();var to=+li.dataset.i;
      if(dragI==null||dragI===to)return;
      var m=g.batting.splice(dragI,1)[0];g.batting.splice(to,0,m);save();renderBatting();
    };
  });
}

/* ================= ROSTER TAB ================= */
function renderRoster(){
  var el=document.getElementById('tab-roster');
  var h='<div class="card"><h2>Roster &amp; Position Development</h2>';
  h+='<div class="muted">Click a position box to cycle: <b style="color:var(--green)">PRI</b> (primary) → <b style="color:var(--blue)">SEC</b> (secondary) → <b style="color:var(--red)">OUT</b> (lock-out) → blank. Blank means the generator will only use it as a last resort. Pitching is chosen by hand each inning, so it is not listed here.</div>';
  h+='<table style="margin-top:10px"><tr><th>Player</th>'+FIELD_POS.map(function(p){return '<th class="num">'+p+'</th>';}).join('')+'<th></th></tr>';
  S.roster.forEach(function(p,ri){
    h+='<tr><td><input type="text" data-nm="'+p.id+'" value="'+esc(p.name)+'" size="10"></td>';
    FIELD_POS.forEach(function(pos){
      var st=p.primary.indexOf(pos)!==-1?'pri':(p.secondary.indexOf(pos)!==-1?'sec':(p.lockout.indexOf(pos)!==-1?'lock':''));
      var lbl=st==='pri'?'PRI':(st==='sec'?'SEC':(st==='lock'?'OUT':'–'));
      h+='<td class="num" style="padding:2px"><button class="pos-btn '+st+'" data-cyc="'+p.id+'|'+pos+'">'+lbl+'</button></td>';
    });
    h+='<td><button class="btn sm danger" data-del="'+p.id+'">Remove</button></td></tr>';
  });
  h+='</table>';
  h+='<div class="row" style="margin-top:10px"><button class="btn sm" id="addp">+ Add player</button><span class="muted">'+S.roster.length+' players</span></div>';
  h+='</div>';

  h+='<div class="card"><h2>Position Coverage</h2><div class="muted">How many players can legally fill each spot. A position with very few options makes lineups hard to build.</div>';
  h+='<table style="margin-top:8px"><tr><th>Position</th><th class="num">Primary</th><th class="num">Secondary</th><th class="num">Locked out</th><th>Primary players</th></tr>';
  FIELD_POS.forEach(function(pos){
    var pri=S.roster.filter(function(p){return p.primary.indexOf(pos)!==-1;});
    var sec=S.roster.filter(function(p){return p.secondary.indexOf(pos)!==-1;}).length;
    var lk=S.roster.filter(function(p){return p.lockout.indexOf(pos)!==-1;}).length;
    h+='<tr><td><b>'+pos+'</b></td><td class="num '+(pri.length<2?'hot':'')+'">'+pri.length+'</td><td class="num">'+sec+'</td><td class="num">'+lk+'</td><td class="muted">'+pri.map(function(p){return esc(p.name);}).join(', ')+'</td></tr>';
  });
  h+='</table></div>';
  el.innerHTML=h;

  Array.prototype.forEach.call(document.querySelectorAll('[data-cyc]'),function(b){
    b.onclick=function(){
      var parts=b.dataset.cyc.split('|'),p=P(parts[0]),pos=parts[1];
      var rm=function(a){var i=a.indexOf(pos);if(i!==-1)a.splice(i,1);};
      if(p.primary.indexOf(pos)!==-1){rm(p.primary);p.secondary.push(pos);}
      else if(p.secondary.indexOf(pos)!==-1){rm(p.secondary);p.lockout.push(pos);}
      else if(p.lockout.indexOf(pos)!==-1){rm(p.lockout);}
      else p.primary.push(pos);
      save();renderRoster();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-nm]'),function(inp){
    inp.oninput=function(){P(inp.dataset.nm).name=inp.value;save();};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){
    b.onclick=function(){
      var id=b.dataset.del;
      if(!confirm('Remove '+nm(id)+' from the roster? Past games keep their saved lineups.')) return;
      S.roster=S.roster.filter(function(p){return p.id!==id;});
      S.games.forEach(function(g){
        g.absent=g.absent.filter(function(x){return x!==id;});
        g.priority=g.priority.filter(function(x){return x!==id;});
        g.pitchers=g.pitchers.map(function(x){return x===id?null:x;});
        if(g.batting) g.batting=g.batting.filter(function(x){return x!==id;});
      });
      save();renderRoster();
    };
  });
  document.getElementById('addp').onclick=function(){
    S.roster.push({id:uid(),name:'New Player',primary:[],secondary:[],lockout:[]});
    save();renderRoster();
  };
}

/* ================= SEASON TAB ================= */
function renderSeason(){
  var el=document.getElementById('tab-season');
  var played=S.games.filter(function(g){return g.lineup;});
  var sits={},pri={},posTot={};
  S.roster.forEach(function(p){sits[p.id]=0;pri[p.id]=0;posTot[p.id]={};});
  var perGame=S.games.map(function(g){
    var row={};
    if(!g.lineup) return null;
    S.roster.forEach(function(p){row[p.id]=g.absent.indexOf(p.id)!==-1?null:0;});
    g.lineup.forEach(function(inn){
      inn.bench.forEach(function(id){if(row[id]!=null){row[id]++;sits[id]++;}});
      ALL_POS.forEach(function(pos){
        var id=inn.map[pos];if(!id||!posTot[id])return;
        posTot[id][pos]=(posTot[id][pos]||0)+1;
        var p=P(id);
        if(pos!=='P'&&p&&p.primary.indexOf(pos)!==-1) pri[id]++;
      });
    });
    return row;
  });
  var h='<div class="card"><h2>Season Bench Tracker</h2>';
  h+='<div class="muted">Bench innings per game. Totals feed the next lineup automatically — players who have sat most are the last to sit again.</div>';
  h+='<table style="margin-top:10px"><tr><th>Player</th>'+S.games.map(function(g){return '<th class="num">'+esc(g.name.replace('Game ','G'))+'</th>';}).join('')+'<th class="num">Total Bench</th><th class="num">Primary Inn</th></tr>';
  var totals=S.roster.map(function(p){return sits[p.id];});
  var mx=totals.length?Math.max.apply(null,totals):0,mn=totals.length?Math.min.apply(null,totals):0;
  S.roster.slice().sort(function(a,b){return sits[b.id]-sits[a.id]||a.name.localeCompare(b.name);}).forEach(function(p){
    h+='<tr><td>'+esc(p.name)+'</td>';
    perGame.forEach(function(row,i){
      if(!row) h+='<td class="num muted">–</td>';
      else if(row[p.id]==null) h+='<td class="num muted" title="absent">abs</td>';
      else h+='<td class="num">'+row[p.id]+'</td>';
    });
    var cls=played.length&&mx!==mn?(sits[p.id]===mx?'hot':(sits[p.id]===mn?'cool':'')):'';
    h+='<td class="num '+cls+'">'+sits[p.id]+'</td><td class="num">'+pri[p.id]+'</td></tr>';
  });
  h+='</table>';
  if(played.length) h+='<div class="'+(mx-mn>2?'warn':'good')+'">Season bench spread: '+mn+' to '+mx+' innings across '+played.length+' game(s). '+(mx-mn>2?'Consider making the low-bench players sit first next game.':'Well balanced.')+'</div>';
  else h+='<div class="muted" style="margin-top:10px">No lineups generated yet.</div>';
  h+='</div>';

  h+='<div class="card"><h2>Innings by Position (Season)</h2><table><tr><th>Player</th>'+ALL_POS.map(function(p){return '<th class="num">'+p+'</th>';}).join('')+'</tr>';
  S.roster.forEach(function(p){
    h+='<tr><td>'+esc(p.name)+'</td>'+ALL_POS.map(function(pos){
      var v=posTot[p.id][pos]||0;
      var isPri=p.primary.indexOf(pos)!==-1;
      return '<td class="num'+(v&&isPri?' cool':'')+'">'+(v||'')+'</td>';
    }).join('')+'</tr>';
  });
  h+='</table><div class="muted" style="margin-top:6px">Green = a primary position for that player.</div></div>';

  var withOrder=S.games.filter(function(g){return g.batting&&g.batting.length;});
  h+='<div class="card"><h2>Batting Slot by Game</h2>';
  h+='<div class="muted">Each game flips the previous game\'s order, so a player near the bottom one week is near the top the next. The average column is what evens out.</div>';
  h+='<table style="margin-top:10px"><tr><th>Player</th>'+S.games.map(function(g){return '<th class="num">'+esc(g.name.replace('Game ','G'))+'</th>';}).join('')+'<th class="num">Avg Slot</th></tr>';
  var avgs={};
  S.roster.forEach(function(p){
    var slots=[];
    S.games.forEach(function(g){ if(g.batting&&g.batting.length){var k=g.batting.indexOf(p.id);if(k!==-1)slots.push(k+1);} });
    avgs[p.id]=slots.length?slots.reduce(function(a,b){return a+b;},0)/slots.length:null;
  });
  var av=S.roster.map(function(p){return avgs[p.id];}).filter(function(x){return x!==null;});
  var amax=av.length?Math.max.apply(null,av):0, amin=av.length?Math.min.apply(null,av):0;
  S.roster.slice().sort(function(a,b){return (avgs[a.id]===null?99:avgs[a.id])-(avgs[b.id]===null?99:avgs[b.id]);}).forEach(function(p){
    h+='<tr><td>'+esc(p.name)+'</td>';
    S.games.forEach(function(g){
      if(!g.batting||!g.batting.length) h+='<td class="num muted">–</td>';
      else{
        var k=g.batting.indexOf(p.id);
        h+=k===-1?'<td class="num muted" title="absent">abs</td>':'<td class="num">'+(k+1)+'</td>';
      }
    });
    var a=avgs[p.id];
    var cls=(a!==null&&av.length>1&&amax!==amin)?(a===amax?'hot':(a===amin?'cool':'')):'';
    h+='<td class="num '+cls+'">'+(a===null?'–':a.toFixed(1))+'</td></tr>';
  });
  h+='</table>';
  if(withOrder.length>1) h+='<div class="'+(amax-amin>2.5?'warn':'good')+'">Average slot ranges from '+amin.toFixed(1)+' to '+amax.toFixed(1)+' across '+withOrder.length+' games. '+(amax-amin>2.5?'Green sits highest in the order on average, red lowest — worth a manual nudge.':'Plate appearances are evening out nicely.')+'</div>';
  h+='</div>';

  h+='<div class="card noprint"><h2>Manage Games</h2><table><tr><th>Game</th><th>Date</th><th>Opponent</th><th class="num">Innings</th><th>Status</th><th></th></tr>';
  S.games.forEach(function(g,i){
    h+='<tr><td><input type="text" data-gn="'+i+'" value="'+esc(g.name)+'" size="10"></td><td>'+esc(g.date||'–')+'</td><td>'+esc(g.opponent||'–')+'</td><td class="num">'+INNS(g)+'</td>'+
       '<td>'+(g.lineup?'lineup saved':'not set')+'</td>'+
       '<td><button class="btn sm" data-open="'+i+'">Open</button> <button class="btn sm danger" data-wipe="'+i+'">Clear lineup</button></td></tr>';
  });
  h+='</table></div>';
  el.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'),function(b){
    b.onclick=function(){S.current=+b.dataset.open;save();show('lineup');};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-wipe]'),function(b){
    b.onclick=function(){var i=+b.dataset.wipe;if(confirm('Clear the saved lineup for '+S.games[i].name+'?')){S.games[i].lineup=null;save();renderSeason();}};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-gn]'),function(inp){
    inp.oninput=function(){S.games[+inp.dataset.gn].name=inp.value;save();};
  });
}

/* ================= HELP TAB ================= */
function renderHelp(){
  document.getElementById('tab-help').innerHTML=
  '<div class="card help"><h2>Saving Your Work</h2>'+
  '<p><b>Everything saves by itself.</b> Every change you make — roster edits, attendance, pitchers, a generated lineup, the batting order — is written to this device the instant you make it. The small <b>Saved</b> tag in the bottom corner confirms it. Close the app, come back next week, and Game 1 through Game 6 will all still be there.</p>'+
  '<p><b>What you do NOT need to do:</b> there is no Save button, and you never need to re-enter the roster. Set it up once in August and it carries the whole season.</p>'+
  '<h3>Back it up (do this once)</h3>'+
  '<p>The save lives in this app on this device. If you clear browsing data, switch computers, or want to hand the season off to another coach, click <b>Download backup</b> below. That gives you a small <code>.json</code> file. Keep it in your phone’s files or email it to yourself. To restore it — on a new device or after a mishap — click <b>Restore from backup</b> and pick that file.</p>'+
  '<div class="row"><button class="btn primary" id="expBtn">Download backup</button><button class="btn" id="impBtn">Restore from backup</button><button class="btn danger" id="resetBtn">Reset everything</button></div>'+
  '<p class="muted" style="margin-top:8px">Tip: download a fresh backup after you finalize each game, so the season tracker is never more than one game out of date.</p>'+
  '</div>'+
  '<div class="card help"><h2>How a Game Works</h2>'+
  '<ol>'+
  '<li><b>Innings</b> — set the expected game length in the Innings box (1–12). Defaults to 5, saved per game, and new games inherit the length of the one you were just on.</li>'+
  '<li><b>Attendance</b> — tap any player who is not there. They drop out of the lineup and the batting order.</li>'+
  '<li><b>Priority players</b> — tap the players you want locked to their primary spots that day. Everyone else flexes between primary and secondary. Priority does not buy extra playing time; bench innings stay even.</li>'+
  '<li><b>Pitchers</b> — pick who throws each inning. That is the one input the generator does not decide.</li>'+
  '<li><b>Generate</b> — fills the other eight spots. Hit <b>Shuffle Again</b> for a different valid arrangement.</li>'+
  '<li><b>Adjust</b> — change any cell from its dropdown. The displaced player swaps into the spot you took them from, so the inning stays legal. Warnings update live.</li>'+
  '<li><b>Print Card</b> — clean dugout copy with the grid and batting order.</li>'+
  '</ol></div>'+
  '<div class="card help"><h2>How the Batting Order Rotates</h2>'+
  '<p>Set the order however you want for your first game. From then on, <b>every game flips the previous game\'s order</b> — whoever batted last now bats first, second-to-last bats second, and so on. Over the season that evens out plate appearances without you tracking anything.</p>'+
  '<p>It fills in automatically the first time you open a game\'s Batting Order tab, and it is only a starting point — drag anyone anywhere. The <i>next</i> game flips whatever you finish with, edits included. Each name shows where it batted last game so you can check the flip at a glance.</p>'+
  '<p><b>Absences.</b> Anyone missing today drops out of the order. When they come back they <b>lead off</b>, ahead of the flipped order, to make up some of the at-bats they missed. If more than one player is returning, whoever missed more games hits first.</p>'+
  '<p>Changed an earlier game\'s order after a later one was already built? Open the later game and click <b>Re-flip</b> to rebuild it from the corrected order.</p>'+
  '<p>The <b>Batting Slot by Game</b> table on the Season tab shows every player\'s slot each game plus their season average — that average column is the one to watch.</p>'+
  '</div>'+
  '<div class="card help"><h2>When the Game Runs Long or Short</h2>'+
  '<p>Real games do not respect the plan. Use <b>+ Add Inning</b> and <b>&minus; Drop Inning</b> under the setup panel (or change the Innings box, which asks what you meant). This matters: the season tracker counts bench innings from what is saved here, so if the card says five innings and only four were played, every later game is balanced off bad numbers.</p>'+
  '<p><b>Game ended early.</b> Drop the innings that were not played. Innings 1 through the last one played are kept <i>exactly</i> as they were — nothing is reshuffled. The cut innings are parked, not deleted.</p>'+
  '<p><b>Game went long.</b> Add an inning; you pick the pitcher and the other eight spots fill in around whoever has already sat. Played innings are never touched. Add again for each additional inning.</p>'+
  '<p><b>Changed your mind.</b> If you trimmed an inning and the game turns out to continue, adding it back restores the parked inning as it was, as long as the same players are still available. Otherwise a fresh one is built.</p>'+
  '<p>If a shortened game leaves bench innings uneven, that is simply what happened — you will see a note, and the season tracker automatically gives the shorted players first claim on playing time next game.</p>'+
  '</div>'+
  '<div class="card help"><h2>Rules the Generator Follows</h2>'+
  '<ul>'+
  '<li><b>Never</b> puts a player at a lock-out position.</li>'+
  '<li>Bench innings stay within <b>1</b> of each other — nobody sits two more than anybody else.</li>'+
  '<li>Nobody sits two innings back to back.</li>'+
  '<li>Priority players get a primary position every inning they are on the field.</li>'+
  '<li>Everyone else gets primary positions where possible, secondary where needed, and repeats of the same position are discouraged so players move around.</li>'+
  '<li><b>Soft rule:</b> the next inning’s pitcher sits the inning before so he can warm up. This bends when it would break bench fairness.</li>'+
  '<li>Season bench totals carry into the next game — whoever has sat the most is the last to sit again.</li>'+
  '</ul>'+
  '<p class="muted">If a lineup cannot be built at all, it usually means too many lock-outs at a thin position. The <b>Position Coverage</b> table on the Roster tab shows where you are short.</p>'+
  '</div>';
  document.getElementById('expBtn').onclick=doExport;
  document.getElementById('impBtn').onclick=function(){document.getElementById('fileIn').click();};
  document.getElementById('resetBtn').onclick=function(){
    if(confirm('Erase the roster, all six games, and the season tracker? This cannot be undone.')){
      S=freshState();save();render();
    }
  };
}
function doExport(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='fall-ball-lineup-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
document.getElementById('fileIn').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d.roster) throw new Error('not a lineup backup');
      S=d;load();save();render();alert('Backup restored.');
    }catch(err){alert('Could not read that file: '+err.message);}
    e.target.value='';
  };
  r.readAsText(f);
};

/* ================= BOOT ================= */
function render(){
  var vis=TABS.filter(function(t){return document.getElementById('tab-'+t).style.display!=='none';})[0]||'lineup';
  if(vis==='lineup') renderLineup();
  else if(vis==='batting') renderBatting();
  else if(vis==='roster') renderRoster();
  else if(vis==='season') renderSeason();
  else renderHelp();
}
load();
render();
console.log('lineup app ready; roster '+S.roster.length+' games '+S.games.length+' restoredFromSave='+(window.__restored?'yes':'no (first run)'));
</script>
